/* ── RESET ────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{color-scheme:light dark;}
body{
  font-family:'Source Sans 3',system-ui,sans-serif;
  font-weight:400;font-size:15px;line-height:1.6;
  color:var(--ink);background:var(--ground);min-height:100vh;
}
button{font-family:inherit;cursor:pointer;}
a{color:var(--primary);}

/* ── HEADER ───────────────────────────────────────────── */
.site-header{
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:0 28px;height:56px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:10;
}
.logo{
  display:flex;align-items:baseline;gap:10px;
}
.logo-name{
  font-family:'Playfair Display',Georgia,serif;
  font-weight:700;font-size:18px;
  color:var(--primary);letter-spacing:-0.02em;
}
.logo-by{
  font-size:11px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);
}
.header-stat{
  font-size:12px;color:var(--ink-3);font-weight:500;
}

/* ── HERO ─────────────────────────────────────────────── */
.hero{
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:52px 24px 44px;
  text-align:center;
}
.hero-hl{
  font-family:'Playfair Display',Georgia,serif;
  font-weight:700;
  font-size:clamp(30px,4.5vw,50px);
  line-height:1.15;letter-spacing:-.025em;
  color:var(--ink);text-wrap:balance;
  max-width:560px;margin:0 auto 14px;
}
.hero-sub{
  color:var(--ink-2);font-size:16px;font-weight:300;
  max-width:440px;margin:0 auto 36px;
}

/* ROLE TOGGLE */
.role-row{display:flex;justify-content:center;margin-bottom:22px;}
.role-bar{
  display:inline-flex;
  background:var(--chip-bg);border-radius:var(--r-pill);
  padding:3px;gap:2px;
}
.role-btn{
  padding:7px 22px;border-radius:var(--r-pill);border:none;
  background:transparent;color:var(--ink-2);
  font-size:14px;font-weight:500;
  transition:background .15s,color .15s;
}
.role-btn.active{background:var(--primary);color:#fff;}
.role-btn:hover:not(.active){background:var(--border);}

/* SEARCH */
.search-wrap{
  max-width:580px;margin:0 auto;
  position:relative;
}
.search-input{
  width:100%;
  padding:13px 120px 13px 18px;
  border:1.5px solid var(--border);border-radius:var(--r);
  background:var(--card);color:var(--ink);
  font-family:inherit;font-size:15px;line-height:1.5;
  outline:none;resize:none;
  transition:border-color .15s,box-shadow .15s;
}
.search-input:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 14%,transparent);
}
.search-input::placeholder{color:var(--ink-3);}
.search-btn{
  position:absolute;right:8px;top:8px;
  padding:8px 20px;
  background:var(--primary);color:#fff;border:none;
  border-radius:var(--r-sm);
  font-size:14px;font-weight:600;letter-spacing:.01em;
  transition:background .15s;
  white-space:nowrap;
}
.search-btn:hover{background:var(--accent);}
.search-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* QUICK CHIPS */
.quick-topics{
  display:flex;flex-wrap:wrap;gap:7px;
  justify-content:center;max-width:660px;
  margin:24px auto 0;
}
.topic-chip{
  padding:5px 14px;border-radius:var(--r-pill);
  background:var(--chip-bg);color:var(--chip-fg);
  border:none;font-size:13px;font-weight:500;
  transition:background .12s,color .12s;
}
.topic-chip:hover{background:var(--primary);color:#fff;}
.topic-chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* ── RESULTS ──────────────────────────────────────────── */
.results-section{
  max-width:1240px;margin:0 auto;
  padding:32px 24px 72px;
}
.results-bar{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:24px;
}
.results-label{
  font-size:11px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);
}
.results-count{font-size:13px;color:var(--ink-3);}

/* BOOK GRID */
.book-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:18px;
}

/* BOOK CARD */
.book-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:20px;
  display:flex;flex-direction:column;gap:10px;
  box-shadow:var(--shadow);
  transition:transform .18s,box-shadow .18s;
  cursor:pointer;
}
.book-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hov);}
.book-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.book-source{
  font-size:10.5px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--accent);
}
.book-title{
  font-family:'Playfair Display',Georgia,serif;
  font-weight:700;font-size:17px;line-height:1.3;
  color:var(--ink);text-wrap:balance;
}
.book-author{
  font-size:13px;color:var(--ink-2);
  margin-top:-4px;
}
.book-match{
  font-size:13px;color:var(--ink-2);
  font-style:italic;
  border-left:2px solid var(--accent);
  padding-left:10px;margin-top:2px;
  line-height:1.4;
}
.book-match strong{font-style:normal;font-weight:600;color:var(--ink);}
.book-desc{
  font-size:13px;color:var(--ink-2);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
  overflow:hidden;
}
.book-meta-row{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  font-size:12px;color:var(--ink-3);
}
.book-rating{display:flex;align-items:center;gap:3px;}
.star-icon{color:#F5A623;font-size:12px;}
.book-age{
  padding:2px 7px;border-radius:var(--r-pill);
  background:var(--chip-bg);color:var(--chip-fg);
  font-size:11px;font-weight:500;
}
.book-tags{
  display:flex;flex-wrap:wrap;gap:5px;
  margin-top:auto;padding-top:4px;
}
.tag{
  font-size:11px;font-weight:500;
  padding:3px 9px;border-radius:var(--r-pill);
  background:var(--tag-bg);color:var(--tag-fg);
  text-transform:capitalize;
}

/* SKELETONS */
@keyframes shimmer{
  0%{background-position:-600px 0}
  100%{background-position:600px 0}
}
.skel{
  border-radius:4px;
  background:linear-gradient(90deg,var(--skel-base) 25%,var(--skel-shine) 50%,var(--skel-base) 75%);
  background-size:1200px 100%;
  animation:shimmer 1.6s infinite;
}
.sk-source{height:10px;width:38%;}
.sk-title{height:20px;width:88%;}
.sk-title2{height:16px;width:60%;margin-top:-4px;}
.sk-author{height:12px;width:50%;}
.sk-tags{height:22px;width:72%;}

/* STATES */
.empty-state{
  grid-column:1/-1;
  text-align:center;padding:72px 24px;color:var(--ink-2);
}
.empty-state h3{
  font-size:18px;font-weight:600;margin-bottom:8px;color:var(--ink);
}

/* ── FOOTER ───────────────────────────────────────────── */
.site-footer{
  border-top:1px solid var(--border);background:var(--surface);
  padding:24px;text-align:center;
  font-size:13px;color:var(--ink-3);
}
.site-footer a{color:var(--ink-3);text-decoration:underline;text-underline-offset:3px;}

/* ── MODAL ────────────────────────────────────────────── */
.modal-overlay{
  position:fixed;inset:0;z-index:100;
  background:rgba(15,22,16,.55);
  backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  animation:fadeIn .18s ease;
}
.modal-overlay[hidden]{display:none;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:0 8px 40px rgba(0,0,0,.22);
  max-width:680px;width:100%;
  max-height:90vh;overflow-y:auto;
  position:relative;
  animation:slideUp .2s ease;
}
@keyframes slideUp{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-close{
  position:absolute;top:14px;right:14px;
  width:32px;height:32px;border-radius:50%;border:none;
  background:var(--chip-bg);color:var(--ink-2);
  font-size:16px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  transition:background .12s,color .12s;z-index:1;
}
.modal-close:hover{background:var(--border);color:var(--ink);}
.modal-inner{
  display:flex;gap:0;
}
.modal-cover-col{
  flex:0 0 180px;
  background:var(--ground);
  border-radius:16px 0 0 16px;
  display:flex;align-items:flex-start;justify-content:center;
  padding:28px 20px 28px;
  min-height:240px;
}
.modal-cover-img{
  width:140px;height:auto;
  border-radius:6px;
  box-shadow:0 4px 16px rgba(0,0,0,.18);
  display:block;
}
.modal-cover-placeholder{
  width:140px;height:180px;
  border-radius:6px;
  background:var(--skel-base);
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-3);font-size:40px;
}
.modal-cover-skel{
  width:140px;height:180px;border-radius:6px;
}
.modal-content-col{
  flex:1;padding:28px 28px 24px 24px;
  display:flex;flex-direction:column;gap:12px;
  min-width:0;
}
.modal-source{
  font-size:10.5px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--accent);
}
.modal-title{
  font-family:'Playfair Display',Georgia,serif;
  font-weight:700;font-size:22px;line-height:1.25;
  color:var(--ink);text-wrap:balance;
  margin-top:-2px;
}
.modal-author{font-size:14px;color:var(--ink-2);margin-top:-6px;}
.modal-desc{
  font-size:14px;color:var(--ink-2);line-height:1.6;
  border-top:1px solid var(--border);padding-top:12px;
}
.modal-desc.loading{
  height:56px;border-radius:4px;
  background:linear-gradient(90deg,var(--skel-base) 25%,var(--skel-shine) 50%,var(--skel-base) 75%);
  background-size:1200px 100%;
  animation:shimmer 1.6s infinite;
  border-top:none;
}
.modal-all-tags{
  display:flex;flex-wrap:wrap;gap:5px;
}
.modal-actions{
  margin-top:auto;padding-top:8px;
  display:flex;gap:10px;flex-wrap:wrap;
}
.btn-primary{
  display:inline-flex;align-items:center;gap:6px;
  padding:9px 20px;
  background:var(--primary);color:#fff;
  border-radius:var(--r-sm);border:none;
  font-size:13px;font-weight:600;
  text-decoration:none;
  transition:background .15s;
}
.btn-primary:hover{background:var(--primary-h);color:#fff;}
.btn-secondary{
  display:inline-flex;align-items:center;gap:6px;
  padding:9px 20px;
  background:transparent;color:var(--ink-2);
  border-radius:var(--r-sm);
  border:1px solid var(--border);
  font-size:13px;font-weight:500;
  text-decoration:none;
  transition:background .15s,border-color .15s;
}
.btn-secondary:hover{background:var(--chip-bg);border-color:var(--ink-3);}
@media(max-width:560px){
  .modal-inner{flex-direction:column;}
  .modal-cover-col{
    border-radius:16px 16px 0 0;
    flex-direction:row;gap:16px;align-items:center;
    padding:20px 20px 16px;min-height:auto;
  }
  .modal-cover-img,.modal-cover-skel,.modal-cover-placeholder{width:80px;}
  .modal-cover-placeholder{height:100px;font-size:28px;}
  .modal-content-col{padding:16px 20px 20px;}
}

/* ── RESPONSIVE ───────────────────────────────────────── */
@media(max-width:600px){
  .hero{padding:36px 16px 32px;}
  .results-section{padding:24px 16px 56px;}
  .search-input{padding-right:108px;}
  .search-btn{padding:8px 16px;font-size:13px;}
  .logo-by{display:none;}
}
@media(prefers-reduced-motion:reduce){
  .book-card{transition:none;}
  .skel{animation:none;}
}
</style>

const PLACEHOLDERS = {
  parent:  'My child is anxious about starting middle school…',
  teacher: 'I need books for students dealing with bullying or exclusion…',
  student: "I feel left out and don't know how to make friends…",
};

// ── STATE ────────────────────────────────────────────────
let currentRole = 'parent';

// ── INIT ─────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  renderTopics();
  loadFeatured();

  document.querySelectorAll('.role-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentRole = btn.dataset.role;
      document.getElementById('searchInput').placeholder = PLACEHOLDERS[currentRole];
      // Re-run current view with new role filter
      const q = document.getElementById('searchInput').value.trim();
      if (q) runSearch(); else loadFeatured();
    });
  });

  const inp = document.getElementById('searchInput');
  document.getElementById('searchBtn').addEventListener('click', runSearch);
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); runSearch(); }
  });
});

function renderTopics() {
  const el = document.getElementById('quickTopics');
  el.innerHTML = TOPICS.map(t =>
    `<button class="topic-chip" data-q="${esc(t.q)}">${esc(t.label)}</button>`
  ).join('');
  el.querySelectorAll('.topic-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.getElementById('searchInput').value = chip.dataset.q;
      runSearch();
    });
  });
}

// ── TAG EXTRACTION ────────────────────────────────────────
function extractTags(text) {
  const scores = {};
  for (const rule of RULES) {
    if (rule.re.test(text)) {
      for (const tag of rule.tags) {
        scores[tag] = (scores[tag] || 0) + 1;
      }
    }
  }
  return Object.entries(scores)
    .sort((a,b) => b[1]-a[1])
    .slice(0, 5)
    .map(([tag]) => tag);
}

// ── FETCH ─────────────────────────────────────────────────
async function fetchTag(tag, limit=30) {
  const r = await fetch(
    `${SB}/rest/v1/books?problem_tags=cs.${encodeURIComponent(`{${tag}}`)}&select=*&limit=${limit}`,
    { headers: H }
  );
  if (!r.ok) return [];
  return r.json();
}

async function loadFeatured() {
  showSkeleton();
  try {
    const [a,b,c] = await Promise.all([
      fetchTag('belonging', 15),
      fetchTag('resilience', 12),
      fetchTag('friendship', 12),
    ]);
    const merged = filterByRole(mergeAndScore([...a,...b,...c], []));
    document.getElementById('resultsLabel').textContent = 'Featured';
    document.getElementById('resultsCount').textContent = `${merged.slice(0,12).length} books`;
    renderCards(merged.slice(0,12), [], '');
  } catch(e) {
    showError();
  }
}

async function runSearch() {
  const raw = document.getElementById('searchInput').value.trim();
  if (!raw) return;

  let tags = extractTags(raw);
  if (!tags.length) tags = ['belonging'];

  showSkeleton();
  document.getElementById('resultsLabel').textContent = 'Matching books';
  document.getElementById('resultsCount').textContent = '';

  try {
    const results = await Promise.all(tags.map(t => fetchTag(t, 30)));
    const merged = filterByRole(mergeAndScore(results.flat(), tags));
    const top = merged.slice(0, 15);
    document.getElementById('resultsCount').textContent = `${top.length} found`;
    top.length ? renderCards(top, tags, raw) : showEmpty();
  } catch(e) {
    showError();
  }
}

function normTitle(title) {
  return String(title||'').toLowerCase()
    .replace(/[—–]/g,' ')         // em/en dash → space
    .replace(/[.,!?;:'"……]/g,'')  // punctuation
    .replace(/\.{2,}/g,'')         // ellipsis dots
    .replace(/\s+/g,' ').trim();
}

function audienceHas(b, keyword) {
  const a = b.audience;
  if (!a) return false;
  if (Array.isArray(a)) return a.some(v => String(v).toLowerCase().includes(keyword));
  return String(a).toLowerCase().includes(keyword);
}

function filterByRole(books) {
  if (currentRole === 'teacher') {
    return books.filter(b => audienceHas(b, 'educator'));
  }
  if (currentRole === 'student') {
    return books.filter(b => audienceHas(b, 'children'));
  }
  // parent: show everything
  return books;
}

function mergeAndScore(books, matchTags) {
  const map = new Map();
  for (const b of books) {
    const k = normTitle(b.title) + '|' + String(b.author||'').toLowerCase().trim();
    if (map.has(k)) {
      const entry = map.get(k);
      entry.score++;
      // Collect unique sources
      const s = (b.source || '').replace(/ SEL$/, '').trim();
      if (s && !entry.sources.includes(s)) entry.sources.push(s);
    } else {
      const bt = b.problem_tags || [];
      let bonus = matchTags.filter(t => bt.includes(t)).length;
      const s = (b.source || '').replace(/ SEL$/, '').trim();
      map.set(k, { book: b, score: 1 + bonus, sources: s ? [s] : [] });
    }
  }
  return [...map.values()]
    .sort((a,b) => b.score - a.score)
    .map(v => { v.book._sources = v.sources; return v.book; });
}

function showError() {

function renderCards(books, matchTags, userText) {
  document.getElementById('bookGrid').innerHTML = books.map(b => cardHTML(b, matchTags)).join('');
  document.querySelectorAll('.book-card').forEach((card, i) => {
    card.addEventListener('click', () => openModal(books[i]));
    card.setAttribute('tabindex', '0');
    card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(books[i]); } });
  });
}

function cardHTML(b, matchTags) {
  const tags  = (b.problem_tags || []).slice(0, 4);
  const src   = (b._sources && b._sources.length) ? b._sources.join(' · ') : (b.source || '').replace(/ SEL$/, '');
  const hits  = matchTags.filter(t => (b.problem_tags||[]).includes(t));
  const match = hits.length
    ? `Addresses: <strong>${hits.slice(0,2).map(cap).join(' &amp; ')}</strong>`
    : '';

  // Rating: prefer Google, fall back to Goodreads
  const rating = b.google_rating || b.goodreads_rating;
  const ratingCount = b.google_rating
    ? b.google_ratings_count
    : b.goodreads_ratings_count;
  const ratingHTML = rating
    ? `<span class="book-rating"><span class="star-icon">★</span>${parseFloat(rating).toFixed(1)}${ratingCount ? ` <span style="opacity:.7">(${Number(ratingCount).toLocaleString()})</span>` : ''}</span>`
    : '';

  // Age range
  const ageHTML = (b.age_min != null && b.age_max != null)
    ? `<span class="book-age">Ages ${b.age_min}–${b.age_max}</span>`
    : b.age_min != null
    ? `<span class="book-age">Ages ${b.age_min}+</span>`
    : '';

  const metaRow = (ratingHTML || ageHTML)
    ? `<div class="book-meta-row">${ratingHTML}${ageHTML}</div>`
    : '';

  return `
    <article class="book-card" role="button" aria-label="${esc(b.title)} by ${esc(b.author)}">
      <div class="book-source">${esc(src)}</div>
      <div class="book-title">${esc(b.title)}</div>
      <div class="book-author">${esc(b.author)}</div>
      ${match ? `<div class="book-match">${match}</div>` : ''}
      ${metaRow}
      <div class="book-tags">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
    </article>`;
}

// ── MODAL ─────────────────────────────────────────────────
const modal     = document.getElementById('bookModal');
const modalBox  = modal.querySelector('.modal-box');
let lastFocus   = null;

document.getElementById('modalClose').addEventListener('click', closeModal);
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !modal.hidden) closeModal(); });

function openModal(b) {
  lastFocus = document.activeElement;
  const src = (b._sources && b._sources.length) ? b._sources.join(' · ') : (b.source || '').replace(/ SEL$/, '');
  const tags = b.problem_tags || [];

  document.getElementById('mSource').textContent = src;
  document.getElementById('mTitle').textContent  = b.title;
  document.getElementById('mAuthor').textContent = b.author;
  document.getElementById('mTags').innerHTML     = tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('');

  // Links — prefer DB fields
  const q = encodeURIComponent(`${b.title} ${b.author}`);
  document.getElementById('mGoogleBooks').href = `https://www.google.com/search?q=${q}+book`;
  document.getElementById('mAmazon').href      = b.amazon_url || `https://www.amazon.com/s?k=${q}`;

  const olBtn = document.getElementById('mOpenLibrary');
  if (b.goodreads_url) {
    olBtn.href = b.goodreads_url;
    olBtn.textContent = 'Goodreads ↗';
  } else {
    olBtn.href = `https://openlibrary.org/search?q=${q}`;
    olBtn.textContent = 'Open Library ↗';
  }

  // Sub-info: age range, casel domain, ratings
  const ageStr  = (b.age_min != null && b.age_max != null) ? `Ages ${b.age_min}–${b.age_max}`
                : (b.age_min != null) ? `Ages ${b.age_min}+` : '';
  const casel   = b.casel_domain || '';
  const rParts  = [];
  if (b.google_rating)    rParts.push(`★ ${parseFloat(b.google_rating).toFixed(1)} Google${b.google_ratings_count ? ` (${Number(b.google_ratings_count).toLocaleString()})` : ''}`);
  if (b.goodreads_rating) rParts.push(`★ ${parseFloat(b.goodreads_rating).toFixed(1)} Goodreads${b.goodreads_ratings_count ? ` (${Number(b.goodreads_ratings_count).toLocaleString()})` : ''}`);
  let subEl = document.getElementById('mSubInfo');
  if (!subEl) {
    subEl = document.createElement('div');
    subEl.id = 'mSubInfo';
    subEl.style.cssText = 'font-size:12px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:8px;margin-top:-4px;';
    document.getElementById('mAuthor').insertAdjacentElement('afterend', subEl);
  }
  subEl.innerHTML = [ageStr, casel, ...rParts].filter(Boolean).map(s=>`<span>${esc(s)}</span>`).join('');

  // Cover — use DB cover_url, fall back to Open Library
  const wrap = document.getElementById('modalCoverWrap');
  if (b.cover_url) {
    wrap.innerHTML = '';
    const img = new Image();
    img.className = 'modal-cover-img';
    img.alt = `Cover of ${b.title}`;
    img.onerror = () => { wrap.innerHTML = `<div class="modal-cover-placeholder">📚</div>`; };
    img.src = b.cover_url;
    wrap.appendChild(img);
  } else {
    wrap.innerHTML = `<div class="modal-cover-skel skel" style="width:140px;height:180px;border-radius:6px;"></div>`;
    fetchOpenLibrary(b.title, b.author).then(({ coverUrl }) => {
      if (coverUrl) {
        const img = new Image();
        img.className = 'modal-cover-img';
        img.alt = `Cover of ${b.title}`;
        img.onerror = () => { wrap.innerHTML = `<div class="modal-cover-placeholder">📚</div>`; };
        img.src = coverUrl;
        wrap.innerHTML = '';
        wrap.appendChild(img);
      } else {
        wrap.innerHTML = `<div class="modal-cover-placeholder">📚</div>`;
      }
    });
  }

  // Description — use DB field, fall back to Open Library
  const descEl = document.getElementById('mDesc');
  if (b.description) {
    descEl.className = 'modal-desc';
    descEl.textContent = b.description;
  } else {
    descEl.className = 'modal-desc loading';
    descEl.textContent = '';
    fetchOpenLibrary(b.title, b.author).then(({ description }) => {
      descEl.className = 'modal-desc';
      descEl.textContent = description || '';
    });
  }

  modal.hidden = false;
  document.body.style.overflow = 'hidden';
  document.getElementById('modalClose').focus();
}

function closeModal() {
  modal.hidden = true;
  document.body.style.overflow = '';
  if (lastFocus) lastFocus.focus();
}

async function fetchOpenLibrary(title, author) {
  // Try Google Books first — better descriptions
  try {
    const q = encodeURIComponent(`intitle:${title} inauthor:${author}`);
    const r = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${q}&maxResults=1&fields=items(volumeInfo(description,imageLinks))`);
    if (r.ok) {
      const data = await r.json();
      const info = data.items?.[0]?.volumeInfo;
      if (info) {
        const description = info.description || null;
        const thumb = info.imageLinks?.thumbnail || info.imageLinks?.smallThumbnail || null;
        const coverUrl = thumb ? thumb.replace('http://', 'https://').replace('&zoom=1','&zoom=2') : null;
        if (description || coverUrl) return { coverUrl, description };
      }
    }
  } catch {}
  // Fallback: Open Library
  try {
    const q = encodeURIComponent(`${title} ${author}`);
    const r = await fetch(`https://openlibrary.org/search.json?q=${q}&limit=1&fields=cover_i,first_sentence`);
    if (!r.ok) return { coverUrl: null, description: null };
    const data = await r.json();
    const doc = data.docs?.[0];
    if (!doc) return { coverUrl: null, description: null };
    const coverUrl = doc.cover_i
      ? `https://covers.openlibrary.org/b/id/${doc.cover_i}-M.jpg`
      : null;
    let description = null;
    if (doc.first_sentence) {
      description = Array.isArray(doc.first_sentence) ? doc.first_sentence[0] : doc.first_sentence;
    }
    return { coverUrl, description };
  } catch {
    return { coverUrl: null, description: null };
  }
}

function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function esc(s) {
  return String(s||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
